name: Build & Release

env:
  YTDLP_VERSION: '2026.08.19'
  FFMPEG_VERSION: '8.1.2'
  FFMPEG_WINDOWS_RELEASE: 'autobuild-2026-09-20-13-11'

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '目标草稿 Release（如 V1.2.0）'
        required: true
      platforms:
        description: '构建哪些平台'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r app/requirements.txt
      - run: npm test

  build-mac:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mac')
    runs-on: macos-latest
    env:
      MEDIADROP_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MEDIADROP_SIGNING_REQUIREMENT: ${{ secrets.MACOS_SIGNING_REQUIREMENT }}

    steps:
      - uses: actions/checkout@v4

      - name: Import stable signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Configure the existing signing certificate before publishing}"
          : "${MEDIADROP_SIGNING_IDENTITY:?Missing signing identity}"
          : "${MEDIADROP_SIGNING_REQUIREMENT:?Missing expected designated requirement}"
          CERT_PATH="$RUNNER_TEMP/mediadrop-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mediadrop-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r app/requirements-build.txt

      - name: Build Flask server with PyInstaller
        working-directory: app
        run: pyinstaller mediadrop-server.spec --distpath ../bin-dist

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p bundled-bin
          curl --fail --location --retry 3 -o bundled-bin/yt-dlp_macos "https://github.com/${YTDLP_REPOSITORY}/releases/download/${YTDLP_VERSION}/yt-dlp_macos"
          printf '%s  %s\n' "${YTDLP_MACOS_SHA256}" bundled-bin/yt-dlp_macos | shasum -a 256 -c -
          mv bundled-bin/yt-dlp_macos bundled-bin/yt-dlp
          # Trim universal binary to arm64-only to avoid macOS "Intel chip" warning
          lipo bundled-bin/yt-dlp -thin arm64 -output bundled-bin/yt-dlp 2>/dev/null || true
          chmod +x bundled-bin/yt-dlp

      - name: Build FFmpeg 8.1.2 (static arm64 build)
        shell: bash
        run: |
          scripts/build-ffmpeg-macos.sh bundled-bin/ffmpeg
          node scripts/verify-ffmpeg.js bundled-bin/ffmpeg arm64 "${FFMPEG_VERSION}"

      - name: Copy PyInstaller output to bundled-bin
        shell: bash
        run: |
          cp -r bin-dist/mediadrop-server/* bundled-bin/
          chmod +x bundled-bin/mediadrop-server

      - name: Verify hard-subtitle runtime
        shell: bash
        run: |
          FILTERS="$(bundled-bin/ffmpeg -hide_banner -filters 2>&1)"
          ENCODERS="$(bundled-bin/ffmpeg -hide_banner -encoders 2>&1)"
          for FILTER in ass subtitles; do
            grep -E "[[:space:]]${FILTER}([[:space:]]|$)" <<< "$FILTERS"
          done
          for ENCODER in ass aac libmp3lame libopus libx264 libvpx-vp9 h264_videotoolbox; do
            grep -E "[[:space:]]${ENCODER}([[:space:]]|$)" <<< "$ENCODERS"
          done
          test -f bundled-bin/_internal/fonts/Roboto-Medium.ttf
          test -f bundled-bin/_internal/fonts/NotoSansCJKsc-Regular.otf
          test -f bundled-bin/_internal/fonts/Roboto-OFL.txt
          test -f bundled-bin/_internal/fonts/NotoSansCJK-OFL.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare native glass and YouTube engine
        run: |
          npm run build:glass
          bash scripts/prepare-youtube.sh

      - name: Build macOS DMG
        run: npx electron-builder --mac --arm64

      - name: Verify macOS app and DMG
        run: npm run verify:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-mac-arm64
          path: dist/*.dmg
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/mediadrop-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/mediadrop-signing.p12"

  build-win:
    needs: test
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'win'
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            ffmpeg_asset: ffmpeg-n8.1.2-267-gb2f422d306-win64-gpl-8.1.zip
            ffmpeg_sha256: 66945d35abe59eafba7ebe20c1340adee816302820d89dfe64b739e8d9a8157b
          - arch: arm64
            runner: windows-11-arm
            ffmpeg_asset: ffmpeg-n8.1.2-267-gb2f422d306-winarm64-gpl-8.1.zip
            ffmpeg_sha256: 7570ccdd56466f77132614820d1bee0df0a534633129496e70a345fafd4928cd
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          architecture: x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r app/requirements-build.txt

      - name: Build Flask server with PyInstaller
        working-directory: app
        run: pyinstaller mediadrop-server.spec --distpath ../bin-dist

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p bundled-bin
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ASSET="yt-dlp_arm64.exe"
          else
            ASSET="yt-dlp.exe"
          fi
          curl --fail --location --retry 3 -o "bundled-bin/${ASSET}" "https://github.com/${YTDLP_REPOSITORY}/releases/download/${YTDLP_VERSION}/${ASSET}"
          printf '%s  %s\n' '${{ matrix.ytdlp_sha256 }}' "bundled-bin/${ASSET}" | sha256sum -c -
          if [ "$ASSET" != "yt-dlp.exe" ]; then mv "bundled-bin/${ASSET}" bundled-bin/yt-dlp.exe; fi

      - name: Download FFmpeg 8.1 stable build
        shell: bash
        run: |
          mkdir -p bundled-bin
          ASSET="${{ matrix.ffmpeg_asset }}"
          curl --fail --location --retry 3 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_WINDOWS_RELEASE}/${ASSET}"
          printf '%s  %s\n' '${{ matrix.ffmpeg_sha256 }}' ffmpeg.zip | sha256sum -c -
          7z x ffmpeg.zip -obundled-ffmpeg
          cp bundled-ffmpeg/*/bin/ffmpeg.exe bundled-bin/ffmpeg.exe
          cp bundled-ffmpeg/*/bin/ffprobe.exe bundled-bin/ffprobe.exe

      - name: Verify native download tools
        shell: bash
        run: |
          bundled-bin/yt-dlp.exe --version
          node scripts/verify-ffmpeg.js bundled-bin/ffmpeg.exe "${{ matrix.arch }}" "${FFMPEG_VERSION}"

      - name: Copy PyInstaller output to bundled-bin
        shell: bash
        run: |
          cp -r bin-dist/mediadrop-server/* bundled-bin/
          chmod +x bundled-bin/mediadrop-server 2>/dev/null || true

      - name: Verify hard-subtitle runtime
        shell: bash
        run: |
          FILTERS="$(bundled-bin/ffmpeg.exe -hide_banner -filters 2>&1)"
          ENCODERS="$(bundled-bin/ffmpeg.exe -hide_banner -encoders 2>&1)"
          for FILTER in ass subtitles; do
            grep -E "[[:space:]]${FILTER}([[:space:]]|$)" <<< "$FILTERS"
          done
          for ENCODER in ass aac libmp3lame libopus libx264 libvpx-vp9; do
            grep -E "[[:space:]]${ENCODER}([[:space:]]|$)" <<< "$ENCODERS"
          done
          grep -E 'h264_(nvenc|qsv|amf)' <<< "$ENCODERS"
          test -f bundled-bin/_internal/fonts/Roboto-Medium.ttf
          test -f bundled-bin/_internal/fonts/NotoSansCJKsc-Regular.otf
          test -f bundled-bin/_internal/fonts/Roboto-OFL.txt
          test -f bundled-bin/_internal/fonts/NotoSansCJK-OFL.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare YouTube enhanced engine
        shell: bash
        run: bash scripts/prepare-youtube.sh "$PWD/bundled-bin/youtube" win "${{ matrix.arch }}"

      - name: Verify enhanced engine and token provider
        shell: bash
        run: |
          bundled-bin/youtube/yt-dlp-sabr.exe --version
          node scripts/test-bundled-provider.js bundled-bin/youtube

      - name: Build Windows EXE
        run: npx electron-builder --win --${{ matrix.arch }}

      - name: Rename Windows ARM64 exe
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          for f in dist/*.exe; do
            [ -f "$f" ] && mv "$f" "${f%.exe}.arm64.exe"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-win-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [test, build-mac, build-win]
    if: >-
      always() && !cancelled() && !failure() &&
      (needs.build-mac.result == 'success' || needs.build-win.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: |
          awk 'BEGIN { section=0 } /^## / { if (section) exit; section=1 } section { print }' CHANGELOG.md > release-notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          draft: true
          overwrite_files: true
          files: artifacts/**/*
